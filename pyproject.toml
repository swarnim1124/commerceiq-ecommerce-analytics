[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-ecommerce-analytics"
version = "1.0.0"
description = "GA4 ecommerce analytics pipeline: BigQuery SQL, validated KPIs and Power BI dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20", "db-dtypes>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "sqlglot>=25.0"]

[project.scripts]
ga4-analytics = "ga4_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
